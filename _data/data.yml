career-profile:
    title: Career Profile
    summary: |
      Sunghoon Kim is a engineer at Samsung Electornics (Foundry).
      He received a Master of Science degree in the Department of Electrical Engineering, Pohang University of Science and Technology (POSTECH), Korea in August 2020. Advisor was Prof. Seokhyeong Kang in [CAD & SoC Design Lab.](http://csdl.postech.ac.kr)  
      His research interests in Samsung Foundry included AI-based Yield Ramp-up and Electronic Design Automation methodology development.
      His research interests in POSTECH included energy-efficient deep learning computing at the intersection between machine learning and low power VLSI design. 
      Before joining POSTECH, he received a Bachelor of Science degree with the highest honors in the Material Science Engineering at Ulsan National Institute of Science and Technology (UNIST), Korea in February 2018. 

      -- Last update Jun. 2024 -- 

