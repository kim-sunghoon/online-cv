projects:
    title: Projects

    assignments:
      - title: Circuit PPA Optimization with AI-based Design-space Exploration
        tagline: Samsung Foundry
        details: |
          - Drove AI-assisted design-space exploration for advanced circuit implementation flows.
          - Connected commercial EDA optimization engines with internal methodology to improve timing, power, area, routability, and flow productivity trade-offs.
          - Collaborated with design and CAD teams to translate experiment learnings into reusable flow guidance without exposing confidential design details.
      
      - title: Development and Evaluation of EDA/DT LLMs for Circuit Design Productivity
        tagline: Samsung Foundry
        details: |
          - Evaluated LLM-based assistants and workflow automation for circuit design, EDA troubleshooting, documentation search, and engineering knowledge reuse.
          - Designed prompt and workflow patterns that connect internal knowledge, tool logs, and engineering procedures while respecting confidentiality boundaries.
          - Explored agentic workflows to reduce repetitive analysis and improve collaboration between design, CAD, and methodology engineers.

      - title: HeteroGNN-based Standard Cell Delay Prediction and Explainability
        tagline: Samsung Foundry
        details: |
          - Designed a heterogeneous graph neural network methodology for standard-cell delay prediction by modeling circuit elements, parasitics, connectivity, and operating conditions as graph-structured inputs.
          - Built an explainability workflow to identify transistor, RC, edge, and critical-net factors behind model predictions and align model behavior with circuit-engineering insight.
          - Automated training, hyperparameter search, fine-tuning, inference, and reproducibility workflows to complement SPICE-based analysis and reduce repetitive simulation exploration.

      - title: ML-based Design Rule Violation Prediction for Backend Flow Acceleration
        tagline: Samsung Foundry
        details: |
          - Developed a machine-learning methodology to predict likely design-rule issues earlier in backend implementation flows.
          - Built feature engineering, model evaluation, and explainability workflows to help engineers prioritize risky regions and plan iterations.
          - Contributed to research dissemination through an engineer-track publication.

      - title: AI-based Yield Prediction and Cause Analysis Methodology Development 
        tagline: Samsung Foundry
        details: |
          - Developed ML pipelines for semiconductor data preprocessing, yield prediction, cause analysis, and experiment prioritization.
          - Applied explainable AI and statistical analysis to help engineering teams interpret process and design signals.
          - Contributed to an award-winning internal methodology for foundry yield ramp-up.
        

      - title: Autonomous Accuracy Scaling for Ultra-low-power Intelligent Mobile Systems 
        tagline: Samsung Science & Technology Foundation, POSTECH, et al., Aug. 2018 - Jun. 2020 (1 year and 10 months)

      - title: Deep Learning and Development of Voice Interactive Smart Home Control System based on Internet of Home Things (IoHT)
        tagline: POSCO Future IT Convergence Research Institute, POSTECH, et al., Dec. 2018 - Jun. 2020 (1 year and 6 months)
        
      - title: Camera-based Real-time Artificial Intelligence System for Detecting Driving Environment Recognizing Objects on Road Simultaneously  
        tagline: National Research Foundation, KETI,  POSTECH, DGIST et al., Sep. 2018 - Feb. 2019 (5 months)
   
