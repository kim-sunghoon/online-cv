career-profile:
    title: Career Profile
    summary: |
      Sunghoon Kim is a Staff Engineer at Samsung Electronics (Foundry).
      He received a Master of Science degree in Electrical Engineering from Pohang University of Science and Technology (POSTECH), Korea, in August 2020. Advisor was Prof. Seokhyeong Kang in [CAD & SoC Design Lab.](http://csdl.postech.ac.kr)  
      At Samsung Foundry, his work focuses on backend-flow optimization and circuit PPA optimization, with broader work in AI/ML-driven EDA methodologies, LLM-based engineering automation, standard-cell modeling, and AI-based yield ramp-up.
      At POSTECH, his research focused on energy-efficient deep learning computing at the intersection between machine learning and low-power VLSI design.
      Before joining POSTECH, he received a Bachelor of Science degree with the highest honors in Materials Science Engineering and Electrical & Electronic Engineering at Ulsan National Institute of Science and Technology (UNIST), Korea in February 2018.

      -- Last update Jul. 2026 --

